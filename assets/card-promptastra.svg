<svg xmlns="http://www.w3.org/2000/svg" width="600" height="190" viewBox="0 0 600 190" role="img" aria-label="PromptAstra: System-tray prompt enhancer. Hit a global hotkey in any app and turn a rough prompt into a precise one.">
<title>PromptAstra: System-tray prompt enhancer. Hit a global hotkey in any app and turn a rough prompt into a precise one.</title>
<style>.m{font-family:'JetBrains Mono','Fira Code','SFMono-Regular',Menlo,Consolas,'Liberation Mono',monospace}.s{font-family:'Segoe UI','Inter',-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif}.shine{animation:shine 5s ease-in-out 0.0s infinite}@keyframes shine{0%,60%{transform:translateX(0)}100%{transform:translateX(1000px)}}.cursor{animation:blink 1s steps(1) infinite}@keyframes blink{50%{opacity:0}}.go{animation:nudge 2s ease-in-out infinite}@keyframes nudge{50%{transform:translateX(4px)}}@keyframes blink{50%{opacity:0}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>

<defs>
  <linearGradient id="b0" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="600" y2="190">
    <stop offset="0" stop-color="#22d3ee"/><stop offset="0.35" stop-color="#22d3ee" stop-opacity="0"/>
    <stop offset="0.65" stop-color="#22d3ee" stop-opacity="0"/><stop offset="1" stop-color="#22d3ee"/>
    <animateTransform attributeName="gradientTransform" type="rotate" from="0 300.0 95.0" to="360 300.0 95.0" dur="6s" repeatCount="indefinite"/>
  </linearGradient>
  <linearGradient id="s0" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset="0.5" stop-color="#fff" stop-opacity="0.06"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
  <clipPath id="c0"><rect width="600" height="190" rx="16"/></clipPath>
</defs>
<rect x="1" y="1" width="598" height="188" rx="16" fill="#0b1020" stroke="#1f2a3a" stroke-width="1.5"/>
<rect x="1" y="1" width="598" height="188" rx="16" fill="none" stroke="url(#b0)" stroke-width="2"/>
<g clip-path="url(#c0)"><rect class="shine" x="-200" y="0" width="200" height="190" fill="url(#s0)"/></g>
<g transform="translate(24 30)">
  <rect width="28" height="28" rx="7" fill="#22d3ee" fill-opacity="0.15" stroke="#22d3ee" stroke-opacity="0.6"/>
  <path d="M8 9l5 5-5 5" fill="none" stroke="#22d3ee" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="15" y="18" width="6" height="2.2" fill="#22d3ee" class="cursor"/>
</g>
<text class="s" x="64" y="52" font-size="24" font-weight="800" fill="#e6edf3">PromptAstra</text>
<circle cx="480" cy="44" r="6" fill="#dea584"/>
<text class="s" x="492" y="49" font-size="14" fill="#8b949e">Rust</text>
<text class="s" x="24" y="92" font-size="15.5" fill="#e6edf3" opacity="0.88">System-tray prompt enhancer. Hit a global hotkey in</text>
<text class="s" x="24" y="116" font-size="15.5" fill="#e6edf3" opacity="0.88">any app and turn a rough prompt into a precise one.</text>
