<svg xmlns="http://www.w3.org/2000/svg" width="600" height="190" viewBox="0 0 600 190" role="img" aria-label="Sona: Free, privacy-first, local voice-to-text dictation for Windows. Hold a hotkey, speak, get polished text.">
