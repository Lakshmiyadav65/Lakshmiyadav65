<style>.m{font-family:'JetBrains Mono','Fira Code','SFMono-Regular',Menlo,Consolas,'Liberation Mono',monospace}.s{font-family:'Segoe UI','Inter',-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif}.shine{animation:shine 5s ease-in-out 1.2s infinite}@keyframes shine{0%,60%{transform:translateX(0)}100%{transform:translateX(1000px)}}.cursor{animation:blink 1s steps(1) infinite}@keyframes blink{50%{opacity:0}}.go{animation:nudge 2s ease-in-out infinite}@keyframes nudge{50%{transform:translateX(4px)}}@keyframes blink{50%{opacity:0}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>

