<svg xmlns="http://www.w3.org/2000/svg" width="600" height="190" viewBox="0 0 600 190" role="img" aria-label="ATScribe: AI-powered resume analysis and job recommendations, so students know where their resume stands.">
<title>ATScribe: AI-powered resume analysis and job recommendations, so students know where their resume stands.</title>
<style>.m{font-family:'JetBrains Mono','Fira Code','SFMono-Regular',Menlo,Consolas,'Liberation Mono',monospace}.s{font-family:'Segoe UI','Inter',-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif}.shine{animation:shine 5s ease-in-out 1.7999999999999998s infinite}@keyframes shine{0%,60%{transform:translateX(0)}100%{transform:translateX(1000px)}}.cursor{animation:blink 1s steps(1) infinite}@keyframes blink{50%{opacity:0}}.go{animation:nudge 2s ease-in-out infinite}@keyframes nudge{50%{transform:translateX(4px)}}@keyframes blink{50%{opacity:0}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>

<defs>
  <linearGradient id="b3" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="600" y2="190">
    <stop offset="0" stop-color="#f472b6"/><stop offset="0.35" stop-color="#f472b6" stop-opacity="0"/>
    <stop offset="0.65" stop-color="#f472b6" stop-opacity="0"/><stop offset="1" stop-color="#f472b6"/>
    <animateTransform attributeName="gradientTransform" type="rotate" from="0 300.0 95.0" to="360 300.0 95.0" dur="6s" repeatCount="indefinite"/>
  </linearGradient>
  <linearGradient id="s3" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset="0.5" stop-color="#fff" stop-opacity="0.06"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
  <clipPath id="c3"><rect width="600" height="190" rx="16"/></clipPath>
</defs>
<rect x="1" y="1" width="598" height="188" rx="16" fill="#0b1020" stroke="#1f2a3a" stroke-width="1.5"/>
<rect x="1" y="1" width="598" height="188" rx="16" fill="none" stroke="url(#b3)" stroke-width="2"/>
<g clip-path="url(#c3)"><rect class="shine" x="-200" y="0" width="200" height="190" fill="url(#s3)"/></g>
<g transform="translate(24 30)">
  <rect width="28" height="28" rx="7" fill="#f472b6" fill-opacity="0.15" stroke="#f472b6" stroke-opacity="0.6"/>
  <path d="M8 9l5 5-5 5" fill="none" stroke="#f472b6" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="15" y="18" width="6" height="2.2" fill="#f472b6" class="cursor"/>
</g>
<text class="s" x="64" y="52" font-size="24" font-weight="800" fill="#e6edf3">ATScribe</text>
<circle cx="480" cy="44" r="6" fill="#f1e05a"/>
<text class="s" x="492" y="49" font-size="14" fill="#8b949e">JavaScript</text>
<text class="s" x="24" y="92" font-size="15.5" fill="#e6edf3" opacity="0.88">AI-powered resume analysis and job recommendations,</text>
<text class="s" x="24" y="116" font-size="15.5" fill="#e6edf3" opacity="0.88">so students know where their resume stands.</text>
<rect x="24" y="142" width="36.8" height="26" rx="13" fill="#f472b6" fill-opacity="0.12"/><text class="m" x="42.4" y="159.5" text-anchor="middle" font-size="12.5" fill="#f472b6" textLength="14.8" lengthAdjust="spacingAndGlyphs">ai</text><rect x="68.8" y="142" width="44.2" height="26" rx="13" fill="#f472b6" fill-opacity="0.12"/><text class="m" x="90.9" y="159.5" text-anchor="middle" font-size="12.5" fill="#f472b6" textLength="22.2" lengthAdjust="spacingAndGlyphs">ats</text><rect x="121" y="142" width="66.4" height="26" rx="13" fill="#f472b6" fill-opacity="0.12"/><text class="m" x="154.2" y="159.5" text-anchor="middle" font-size="12.5" fill="#f472b6" textLength="44.4" lengthAdjust="spacingAndGlyphs">resume</text><rect x="195.4" y="142" width="96" height="26" rx="13" fill="#f472b6" fill-opacity="0.12"/><text class="m" x="243.4" y="159.5" text-anchor="middle" font-size="12.5" fill="#f472b6" textLength="74" lengthAdjust="spacingAndGlyphs">javascript</text>
<text x="576" y="160" text-anchor="end" font-size="13" fill="#f472b6" class="m go">view repo →</text>

